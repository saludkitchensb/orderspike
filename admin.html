<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCOP SPIKES — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0D12;--ink-soft:#171A21;--cloud:#F3F3EF;--cloud-dim:#E7E7E1;
    --track-red:#FF3B30;--volt:#C6FF3D;--steel:#8B92A0;--steel-line:#2A2E38;
    --wa:#25D366;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--ink);color:var(--cloud);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2{font-family:'Oswald',sans-serif;font-style:italic;text-transform:uppercase;}

  /* ===== LOGIN ===== */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;
  }
  .login-eyebrow{font-family:'Space Mono',monospace;color:var(--volt);letter-spacing:.1em;font-size:12px;text-transform:uppercase;}
  #loginScreen h1{font-size:26px;}
  #loginScreen input{
    background:var(--ink-soft);border:1px solid var(--steel-line);color:var(--cloud);
    padding:14px 16px;font-family:'Space Mono',monospace;font-size:14px;width:260px;outline:none;
  }
  #loginScreen input:focus{border-color:var(--volt);}
  #loginScreen button{
    background:var(--track-red);color:var(--ink);border:none;padding:14px 30px;
    font-family:'Space Mono',monospace;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
  }
  #loginScreen button:hover{background:var(--volt);}
  #loginError{color:var(--track-red);font-family:'Space Mono',monospace;font-size:12px;display:none;}

  /* ===== DASHBOARD ===== */
  #dashboard{display:none;padding:28px 4vw 80px;}
  #dashboard.show{display:block;}

  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .top h1{font-size:26px;}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .icon-btn{
    display:flex;align-items:center;gap:6px;
    background:var(--ink-soft);border:1px solid var(--steel-line);color:var(--cloud);
    padding:9px 14px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;cursor:pointer;transition:border-color .15s,color .15s;
  }
  .icon-btn:hover{border-color:var(--volt);color:var(--volt);}
  .icon-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .icon-btn.danger:hover{border-color:var(--track-red);color:var(--track-red);}

  /* ===== STATS ===== */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
  .stat-card{background:var(--ink-soft);border:1px solid var(--steel-line);padding:16px;}
  .stat-card .label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);margin-bottom:8px;}
  .stat-card .val{font-family:'Space Mono',monospace;font-size:24px;font-weight:700;color:var(--volt);}
  .stat-card .val.danger{color:var(--track-red);}

  /* ===== FILTERS ===== */
  .filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .filters select,.filters input{
    background:var(--ink-soft);border:1px solid var(--steel-line);color:var(--cloud);
    padding:8px 12px;font-family:'Space Mono',monospace;font-size:12px;outline:none;
  }
  .filters select:focus,.filters input:focus{border-color:var(--volt);}
  .filters input{min-width:200px;}
  .bulk-btn{
    margin-left:auto;display:flex;align-items:center;gap:6px;
    background:var(--ink-soft);border:1px solid var(--steel-line);color:var(--cloud);
    padding:8px 14px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;cursor:pointer;transition:border-color .15s,color .15s;
  }
  .bulk-btn:hover{border-color:var(--volt);color:var(--volt);}
  .bulk-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* ===== BULK PANEL ===== */
  .bulk-panel{
    display:none;background:rgba(198,255,61,.06);border:1px solid rgba(198,255,61,.25);
    padding:12px 16px;margin-bottom:14px;
    align-items:center;gap:12px;flex-wrap:wrap;
  }
  .bulk-panel.show{display:flex;}
  .bulk-panel span{font-family:'Space Mono',monospace;font-size:11px;color:var(--volt);letter-spacing:.04em;}
  .bulk-select{background:var(--ink-soft);border:1px solid var(--steel-line);color:var(--cloud);padding:7px 10px;font-family:'Space Mono',monospace;font-size:11px;}
  .bulk-apply{
    background:var(--volt);color:var(--ink);border:none;padding:8px 14px;
    font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;cursor:pointer;
  }
  .bulk-apply:hover{background:var(--cloud);}

  /* ===== TABLE ===== */
  .table-wrap{overflow-x:auto;background:var(--ink-soft);border:1px solid var(--steel-line);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:900px;}
  thead th{
    font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--volt);text-align:left;padding:10px 9px;border-bottom:1px solid var(--steel-line);white-space:nowrap;
  }
  tbody td{padding:10px 9px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle;}
  tbody tr:hover{background:rgba(198,255,61,.025);}
  tbody tr.selected-row{background:rgba(198,255,61,.06);}

  .order-id{font-family:'Space Mono',monospace;font-size:11px;color:var(--volt);letter-spacing:.04em;}
  .date-cell{color:var(--steel);font-size:11px;white-space:nowrap;}
  .proof-link{color:var(--track-red);font-size:11px;text-decoration:underline;cursor:pointer;}
  .price-cell{font-family:'Space Mono',monospace;color:var(--volt);font-size:12px;}
  .notes-input{
    background:transparent;border:none;border-bottom:1px solid var(--steel-line);
    color:var(--cloud);font-family:'Space Mono',monospace;font-size:11px;
    padding:4px 0;width:110px;outline:none;
  }
  .notes-input:focus{border-bottom-color:var(--volt);}

  /* status pills */
  .pill{display:inline-flex;align-items:center;padding:3px 9px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;}
  .pill-pending{background:rgba(255,59,48,.12);color:var(--track-red);}
  .pill-verified{background:rgba(198,255,61,.12);color:var(--volt);}
  .pill-processing{background:rgba(139,146,160,.12);color:var(--steel);}
  .pill-shipped{background:rgba(37,211,102,.12);color:var(--wa);}
  .pill-completed{background:rgba(198,255,61,.2);color:var(--volt);}
  .pill-cancelled{background:rgba(255,59,48,.08);color:rgba(255,59,48,.6);}

  /* action buttons */
  .actions{display:flex;gap:5px;flex-wrap:wrap;}
  .act-btn{
    background:none;border:1px solid var(--steel-line);color:var(--cloud);
    padding:4px 8px;font-family:'Space Mono',monospace;font-size:9.5px;
    letter-spacing:.04em;text-transform:uppercase;cursor:pointer;white-space:nowrap;
    transition:border-color .15s,color .15s;
  }
  .act-btn:hover{border-color:var(--volt);color:var(--volt);}
  .act-btn.primary{background:var(--volt);border-color:var(--volt);color:var(--ink);}
  .act-btn.primary:hover{background:var(--cloud);border-color:var(--cloud);}

  /* ===== PRINT RECEIPT ===== */
  #receiptPrint{display:none;}
  @media print{
    body *{visibility:hidden;}
    #receiptPrint,#receiptPrint *{visibility:visible;}
    #receiptPrint{display:block;position:absolute;top:0;left:0;width:100%;padding:30px;color:#000;}
    #receiptPrint .r-logo{font-size:22px;font-weight:700;margin-bottom:4px;}
    #receiptPrint table{width:100%;margin-top:16px;}
    #receiptPrint td{padding:6px 0;border-bottom:1px solid #ccc;color:#000;}
  }

  /* ===== TOAST ===== */
  #toast{
    position:fixed;bottom:24px;right:24px;z-index:999;
    background:var(--volt);color:var(--ink);padding:10px 18px;
    font-family:'Space Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.06em;
    opacity:0;transition:opacity .3s;pointer-events:none;
  }
  #toast.show{opacity:1;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-eyebrow">UCOP SPIKES — ADMIN</div>
  <h1>Staff login</h1>
  <input type="password" id="passwordInput" placeholder="Admin password">
  <button id="loginBtn">Enter</button>
  <div id="loginError">Wrong password. Try again.</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="top">
    <h1>Order dashboard</h1>
    <div class="top-actions">
      <button class="icon-btn" id="exportBtn">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export CSV
      </button>
      <button class="icon-btn" id="refreshBtn">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Refresh
      </button>
      <button class="icon-btn danger" id="logoutBtn">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Log out
      </button>
    </div>
  </div>

  <div class="stats" id="statsRow"></div>

  <div class="filters">
    <select id="statusFilter">
      <option value="">All statuses</option>
      <option>Pending Payment Verification</option>
      <option>Payment Verified</option>
      <option>Processing</option>
      <option>Shipped</option>
      <option>Completed</option>
      <option>Cancelled</option>
    </select>
    <select id="productFilter"><option value="">All products</option></select>
    <input type="text" id="searchBox" placeholder="Search name / phone / order ID…">
    <button class="bulk-btn" id="bulkToggleBtn">
      <svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Bulk update
    </button>
  </div>

  <div class="bulk-panel" id="bulkPanel">
    <span id="bulkCount">0 selected</span>
    <select class="bulk-select" id="bulkStatus">
      <option value="">Set status…</option>
      <option>Pending Payment Verification</option>
      <option>Payment Verified</option>
      <option>Processing</option>
      <option>Shipped</option>
      <option>Completed</option>
      <option>Cancelled</option>
    </select>
    <button class="bulk-apply" id="bulkApplyBtn">Apply</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th><input type="checkbox" id="selectAll" style="accent-color:var(--volt);width:13px;height:13px;cursor:pointer;"></th>
          <th>Order ID</th><th>Date</th><th>Customer</th><th>Phone</th>
          <th>Product</th><th>Colour / Size</th><th>Qty</th><th>Total</th>
          <th>Delivery</th><th>Payment</th><th>Proof</th>
          <th>Status</th><th>Notes</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="ordersBody"></tbody>
    </table>
  </div>
</div>

<!-- Print receipt -->
<div id="receiptPrint">
  <div class="r-logo">UCOP SPIKES</div>
  <div>Official Order Receipt</div>
  <table id="receiptTable"></table>
</div>

<div id="toast">Saved</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwULdxGtDe3xgVd51vBhssLJg008FYsl5QXoVAVVG7Ajirg_-GLMbGk0xQAKaT7moKm/exec";

  let PASSWORD = sessionStorage.getItem('ucop_admin_pw') || "";
  let ORDERS = [];
  let bulkMode = false;
  let selectedRows = new Set();

  const loginScreen = document.getElementById('loginScreen');
  const dashboard   = document.getElementById('dashboard');

  // ---- LOGIN ----
  async function tryLogin(pw) {
    if (!API_URL || !API_URL.startsWith('http')) { alert('API_URL not set.'); return false; }
    const res  = await fetch(`${API_URL}?action=getOrders&password=${encodeURIComponent(pw)}`);
    const data = await res.json();
    if (data.success) { PASSWORD = pw; sessionStorage.setItem('ucop_admin_pw', pw); ORDERS = data.orders; showDashboard(); return true; }
    return false;
  }

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const pw = document.getElementById('passwordInput').value;
    const ok = await tryLogin(pw);
    if (!ok) document.getElementById('loginError').style.display = 'block';
  });
  document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });

  document.getElementById('logoutBtn').addEventListener('click', () => { sessionStorage.removeItem('ucop_admin_pw'); location.reload(); });
  document.getElementById('refreshBtn').addEventListener('click', () => loadOrders());

  function showDashboard() {
    loginScreen.style.display = 'none';
    dashboard.classList.add('show');
    populateProductFilter();
    renderStats();
    renderTable();
  }

  async function loadOrders() {
    try {
      const res  = await fetch(`${API_URL}?action=getOrders&password=${encodeURIComponent(PASSWORD)}`);
      const data = await res.json();
      if (data.success) { ORDERS = data.orders; renderStats(); renderTable(); showToast('Refreshed'); }
    } catch(e) { showToast('Failed to refresh'); }
  }

  // ---- STATS ----
  function renderStats() {
    const total     = ORDERS.length;
    const revenue   = ORDERS.reduce((s, o) => s + (parseFloat(o["Total Price (RM)"]) || 0), 0);
    const pending   = ORDERS.filter(o => o.Status === "Pending Payment Verification").length;
    const completed = ORDERS.filter(o => o.Status === "Completed").length;
    document.getElementById('statsRow').innerHTML = `
      <div class="stat-card"><div class="label">Total orders</div><div class="val">${total}</div></div>
      <div class="stat-card"><div class="label">Total revenue</div><div class="val">RM ${revenue.toFixed(0)}</div></div>
      <div class="stat-card"><div class="label">Pending verification</div><div class="val danger">${pending}</div></div>
      <div class="stat-card"><div class="label">Completed</div><div class="val">${completed}</div></div>`;
  }

  // ---- PRODUCT FILTER ----
  function populateProductFilter() {
    const sel = document.getElementById('productFilter');
    const products = [...new Set(ORDERS.map(o => o["Product"]).filter(Boolean))];
    products.forEach(p => {
      const opt = document.createElement('option'); opt.value = p; opt.textContent = p; sel.appendChild(opt);
    });
  }

  // ---- STATUS PILL ----
  const STATUS_PILLS = {
    "Pending Payment Verification": "pill pill-pending",
    "Payment Verified":             "pill pill-verified",
    "Processing":                   "pill pill-processing",
    "Shipped":                      "pill pill-shipped",
    "Completed":                    "pill pill-completed",
    "Cancelled":                    "pill pill-cancelled",
  };

  // ---- NEXT ACTION BUTTONS per status ----
  function actionBtns(o) {
    const row = o._row;
    const btns = [];
    if (o.Status === "Pending Payment Verification") {
      btns.push(`<button class="act-btn primary" onclick="updateStatus(${row},'Payment Verified',this)">Verify</button>`);
      btns.push(`<button class="act-btn" onclick="updateStatus(${row},'Cancelled',this)">Cancel</button>`);
    } else if (o.Status === "Payment Verified") {
      btns.push(`<button class="act-btn primary" onclick="updateStatus(${row},'Processing',this)">Process</button>`);
    } else if (o.Status === "Processing") {
      btns.push(`<button class="act-btn primary" onclick="updateStatus(${row},'Shipped',this)">Mark shipped</button>`);
    } else if (o.Status === "Shipped") {
      btns.push(`<button class="act-btn primary" onclick="updateStatus(${row},'Completed',this)">Complete</button>`);
    }
    btns.push(`<button class="act-btn" onclick="printReceipt(${ORDERS.indexOf(o)})">Print</button>`);
    return btns.join('');
  }

  // ---- RENDER TABLE ----
  function renderTable() {
    const statusFilter  = document.getElementById('statusFilter').value;
    const productFilter = document.getElementById('productFilter').value;
    const search        = document.getElementById('searchBox').value.toLowerCase();
    const tbody         = document.getElementById('ordersBody');
    tbody.innerHTML     = "";
    selectedRows.clear();
    updateBulkCount();

    let list = ORDERS.slice().reverse();
    if (statusFilter)  list = list.filter(o => o.Status === statusFilter);
    if (productFilter) list = list.filter(o => o["Product"] === productFilter);
    if (search) list = list.filter(o =>
      (o["Order ID"]      || "").toLowerCase().includes(search) ||
      (o["Customer Name"] || "").toLowerCase().includes(search) ||
      (o["Phone"]         || "").toLowerCase().includes(search)
    );

    if (!list.length) {
      tbody.innerHTML = `<tr><td colspan="15" style="text-align:center;padding:40px;font-family:'Space Mono',monospace;font-size:12px;color:var(--steel);letter-spacing:.08em;">No orders found</td></tr>`;
      return;
    }

    list.forEach(o => {
      const tr   = document.createElement('tr');
      const date = o.Timestamp ? new Date(o.Timestamp).toLocaleDateString('en-MY', {day:'2-digit',month:'short',year:'numeric'}) : "—";
      const pillClass = STATUS_PILLS[o.Status] || "pill pill-processing";
      tr.dataset.row = o._row;
      tr.innerHTML = `
        <td><input type="checkbox" class="row-cb" data-row="${o._row}" style="accent-color:var(--volt);width:13px;height:13px;cursor:pointer;display:${bulkMode?'block':'none'}"></td>
        <td><span class="order-id">${o["Order ID"] || "—"}</span></td>
        <td class="date-cell">${date}</td>
        <td>${o["Customer Name"] || "—"}</td>
        <td style="font-size:11px;color:var(--steel);">${o["Phone"] || "—"}</td>
        <td style="font-size:11px;">${o["Product"] || "—"}</td>
        <td style="font-size:11px;">${o["Colour"] || "—"} / ${o["Size"] || "—"}</td>
        <td style="text-align:center;">${o["Qty"] || 1}</td>
        <td><span class="price-cell">RM ${o["Total Price (RM)"] || "—"}</span></td>
        <td style="font-size:11px;">${o["Delivery Method"] || "—"}</td>
        <td style="font-size:11px;">${o["Payment Method"] || "—"}</td>
        <td>${o["Payment Proof"] ? `<a class="proof-link" href="${o["Payment Proof"]}" target="_blank">View</a>` : "—"}</td>
        <td><span class="${pillClass}">${o.Status || "—"}</span></td>
        <td><input class="notes-input" placeholder="Add note…" value="${o._notes || ''}" data-row="${o._row}" title="Internal note"></td>
        <td><div class="actions">${actionBtns(o)}</div></td>`;
      tbody.appendChild(tr);
    });

    // checkbox listeners
    tbody.querySelectorAll('.row-cb').forEach(cb => {
      cb.addEventListener('change', () => {
        const row = cb.dataset.row;
        if (cb.checked) { selectedRows.add(row); cb.closest('tr').classList.add('selected-row'); }
        else            { selectedRows.delete(row); cb.closest('tr').classList.remove('selected-row'); }
        updateBulkCount();
      });
    });

    // notes save on blur
    tbody.querySelectorAll('.notes-input').forEach(input => {
      input.addEventListener('blur', async () => {
        const row = input.dataset.row;
        const order = ORDERS.find(o => o._row == row);
        if (order) order._notes = input.value;
        // Optional: persist notes via API if your backend supports it
        showToast('Note saved');
      });
    });
  }

  // ---- UPDATE STATUS ----
  async function updateStatus(row, status, btn) {
    const orig = btn ? btn.textContent : '';
    if (btn) { btn.textContent = '…'; btn.disabled = true; }
    try {
      await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "updateStatus", password: PASSWORD, row: parseInt(row), status })
      });
      const order = ORDERS.find(o => o._row == row);
      if (order) order.Status = status;
      renderStats(); renderTable(); showToast('Status updated');
    } catch(e) {
      if (btn) { btn.textContent = orig; btn.disabled = false; }
      showToast('Failed to update');
    }
  }
  window.updateStatus = updateStatus;

  // ---- SELECT ALL ----
  document.getElementById('selectAll').addEventListener('change', e => {
    document.querySelectorAll('.row-cb').forEach(cb => {
      cb.checked = e.target.checked;
      const row = cb.dataset.row;
      if (e.target.checked) { selectedRows.add(row); cb.closest('tr').classList.add('selected-row'); }
      else                  { selectedRows.delete(row); cb.closest('tr').classList.remove('selected-row'); }
    });
    updateBulkCount();
  });

  // ---- BULK TOGGLE ----
  document.getElementById('bulkToggleBtn').addEventListener('click', () => {
    bulkMode = !bulkMode;
    document.getElementById('bulkPanel').classList.toggle('show', bulkMode);
    document.querySelectorAll('.row-cb').forEach(cb => cb.style.display = bulkMode ? 'block' : 'none');
    if (!bulkMode) { selectedRows.clear(); document.querySelectorAll('.row-cb').forEach(cb => cb.checked = false); document.querySelectorAll('tr.selected-row').forEach(tr => tr.classList.remove('selected-row')); updateBulkCount(); }
  });

  function updateBulkCount() {
    document.getElementById('bulkCount').textContent = `${selectedRows.size} selected`;
  }

  // ---- BULK APPLY ----
  document.getElementById('bulkApplyBtn').addEventListener('click', async () => {
    const status = document.getElementById('bulkStatus').value;
    if (!status) { alert('Choose a status to apply.'); return; }
    if (!selectedRows.size) { alert('Select at least one order.'); return; }
    if (!confirm(`Set ${selectedRows.size} order(s) to "${status}"?`)) return;
    for (const row of selectedRows) {
      await updateStatus(row, status, null);
    }
    selectedRows.clear();
    document.querySelectorAll('.row-cb').forEach(cb => cb.checked = false);
    updateBulkCount();
  });

  // ---- FILTERS ----
  document.getElementById('statusFilter').addEventListener('change', renderTable);
  document.getElementById('productFilter').addEventListener('change', renderTable);
  document.getElementById('searchBox').addEventListener('input', renderTable);

  // ---- EXPORT CSV ----
  document.getElementById('exportBtn').addEventListener('click', () => {
    const headers = ["Order ID","Date","Customer Name","Phone","Product","Colour","Size","Qty","Total Price (RM)","Delivery Method","Payment Method","Status"];
    const rows = ORDERS.map(o => headers.map(h => {
      if (h === "Date") return o.Timestamp ? new Date(o.Timestamp).toLocaleDateString('en-MY') : "";
      return `"${(o[h] || "").toString().replace(/"/g,'""')}"`;
    }).join(','));
    const csv = [headers.join(','), ...rows].join('\n');
    const a = document.createElement('a');
    a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
    a.download = `ucop-orders-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    showToast('CSV exported');
  });

  // ---- PRINT RECEIPT ----
  function printReceipt(idx) {
    const o    = ORDERS[idx];
    const date = o.Timestamp ? new Date(o.Timestamp).toLocaleString('en-MY') : "";
    document.getElementById('receiptTable').innerHTML = `
      <tr><td><b>Order ID</b></td><td>${o["Order ID"]}</td></tr>
      <tr><td><b>Date</b></td><td>${date}</td></tr>
      <tr><td><b>Customer</b></td><td>${o["Customer Name"]}</td></tr>
      <tr><td><b>Phone</b></td><td>${o["Phone"]}</td></tr>
      <tr><td><b>Product</b></td><td>${o["Product"]}</td></tr>
      <tr><td><b>Colour</b></td><td>${o["Colour"]}</td></tr>
      <tr><td><b>Size</b></td><td>${o["Size"]}</td></tr>
      <tr><td><b>Qty</b></td><td>${o["Qty"]}</td></tr>
      <tr><td><b>Total</b></td><td>RM ${o["Total Price (RM)"]}</td></tr>
      <tr><td><b>Delivery</b></td><td>${o["Delivery Method"]}</td></tr>
      <tr><td><b>Address</b></td><td>${o["Address / Notes"] || "—"}</td></tr>
      <tr><td><b>Payment</b></td><td>${o["Payment Method"]}</td></tr>
      <tr><td><b>Status</b></td><td>${o["Status"]}</td></tr>`;
    window.print();
  }
  window.printReceipt = printReceipt;

  // ---- TOAST ----
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  // ---- AUTO LOGIN ----
  if (PASSWORD) {
    tryLogin(PASSWORD).then(ok => { if (!ok) sessionStorage.removeItem('ucop_admin_pw'); });
  }
</script>
</body>
</html>
